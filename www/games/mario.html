<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Platformer Full Screen</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membagi ruang atas (UI), tengah (Game), bawah (Tombol) */
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height untuk HP modern */
            background-color: #202124;
            font-family: monospace;
            color: white;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* UI Skor di atas */
        .ui-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Area Canvas Game */
        .canvas-container {
            flex-grow: 1; /* Mengisi sisa ruang di tengah */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        canvas {
            background-color: #87CEEB;
            /* Memastikan canvas mengisi area tanpa merusak rasio 9:16 */
            height: 100%;
            max-height: 100%;
            width: auto;
            max-width: 100%;
            aspect-ratio: 9 / 16;
            display: block;
        }

        /* Panel Tombol Kontrol di Bawah */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 20px 30px;
            background-color: rgba(0,0,0,0.5);
            z-index: 10;
        }
        .dpad {
            display: flex;
            gap: 20px;
        }
        .btn {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }
        .btn:active, .btn.active {
            background-color: rgba(255, 255, 255, 0.5);
        }
        .btn-jump {
            background-color: #4CAF50;
            border-color: #388E3C;
            width: 85px;
            height: 85px;
            font-size: 18px;
        }
        .btn-jump:active, .btn-jump.active {
            background-color: #388E3C;
        }
    </style>
</head>
<body>
    
    <a href="../index.html" style="position: fixed; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; text-decoration: none; border-radius: 5px; font-family: monospace; font-weight: bold;">
    ⬅ MENU
</a>
    <div class="ui-container">
        <div id="score">Koin: 0</div>
        <div id="lives">Nyawa: 3</div>
    </div>
    
    <div class="canvas-container">
        <!-- Resolusi internal game 360x640 (9:16) -->
        <canvas id="gameCanvas" width="360" height="640"></canvas>
    </div>

    <!-- Tombol Kontrol -->
    <div class="controls">
        <div class="dpad">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn btn-jump" id="btnJump">LOMPAT</div>
    </div>

    <script>
        // (Logika JavaScript sama persis seperti versi sebelumnya yang sudah diperbaiki)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');

        let keys = { left: false, right: false, jump: false };

        let score = 0;
        let lives = 3;
        let gameActive = false;
        let gameOver = false;
        let gameWin = false;

        const gravity = 0.6;
        const friction = 0.8;
        const playerSpeed = 5;
        const jumpPower = -11;

        const player = {
            x: 50, y: 100, width: 25, height: 35,
            vx: 0, vy: 0, isGrounded: false, color: "#2196F3"
        };

        let platforms = [];
        let coins = [];
        let enemies = [];
        let cameraX = 0;
        
        const levelWidth = 1600;
        const groundY = 540;
        const finishLine = { x: levelWidth - 100, y: groundY - 100, width: 20, height: 100 };

        function initGame() {
            score = 0;
            lives = 3;
            gameActive = true;
            gameOver = false;
            gameWin = false;
            cameraX = 0;
            
            player.x = 50;
            player.y = groundY - player.height - 50;
            player.vx = 0;
            player.vy = 0;

            platforms = [
                { x: 0, y: groundY, w: 450, h: 100 },
                { x: 500, y: groundY, w: 250, h: 100 },
                { x: 600, y: 400, w: 80, h: 20 },
                { x: 800, y: groundY, w: 200, h: 100 },
                { x: 1000, y: 450, w: 100, h: 20 },
                { x: 1150, y: groundY, w: 450, h: 100 }
            ];

            coins = [
                { x: 200, y: groundY - 30, r: 10, collected: false },
                { x: 250, y: groundY - 30, r: 10, collected: false },
                { x: 630, y: 370, r: 10, collected: false },
                { x: 900, y: groundY - 30, r: 10, collected: false },
                { x: 1040, y: 420, r: 10, collected: false }
            ];

            enemies = [
                { x: 300, y: groundY - 25, w: 25, h: 25, minX: 200, maxX: 400, dir: 1, alive: true, speed: 1.5 },
                { x: 850, y: groundY - 25, w: 25, h: 25, minX: 800, maxX: 950, dir: -1, alive: true, speed: 1.5 }
            ];

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            scoreElement.innerText = "Koin: " + score;
            livesElement.innerText = "Nyawa: " + Math.max(0, lives);
        }

        function setupControls(btn, key) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); });
            btn.addEventListener('mousedown', () => { keys[key] = true; btn.classList.add('active'); });
            btn.addEventListener('mouseup', () => { keys[key] = false; btn.classList.remove('active'); });
            btn.addEventListener('mouseleave', () => { keys[key] = false; btn.classList.remove('active'); });
        }
        setupControls(btnLeft, 'left');
        setupControls(btnRight, 'right');
        setupControls(btnJump, 'jump');

        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
        });

        function isColliding(r1, r2) {
            return (
                r1.x < r2.x + r2.w && r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.h && r1.y + r1.height > r2.y
            );
        }

        function update() {
            if (!gameActive) return;

            if (keys.left) player.vx -= 1;
            if (keys.right) player.vx += 1;
            
            if (player.vx > playerSpeed) player.vx = playerSpeed;
            if (player.vx < -playerSpeed) player.vx = -playerSpeed;
            
            player.vx *= friction;
            if (Math.abs(player.vx) < 0.1) player.vx = 0;

            if (keys.jump && player.isGrounded) {
                player.vy = jumpPower;
                player.isGrounded = false;
            }

            player.vy += gravity;

            player.x += player.vx;
            for (let p of platforms) {
                if (isColliding(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.width;
                    else if (player.vx < 0) player.x = p.x + p.w;
                    player.vx = 0;
                }
            }

            player.y += player.vy;
            player.isGrounded = false;
            
            for (let p of platforms) {
                if (isColliding(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.isGrounded = true;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            }

            if (player.x < 0) player.x = 0;

            if (player.y > canvas.height + 50) {
                loseLife();
            }

            if (player.x > canvas.width / 2) {
                cameraX = player.x - canvas.width / 2;
            } else {
                cameraX = 0;
            }

            for (let c of coins) {
                if (!c.collected) {
                    let dx = (player.x + player.width/2) - c.x;
                    let dy = (player.y + player.height/2) - c.y;
                    if (Math.sqrt(dx*dx + dy*dy) < c.r + player.width/2) {
                        c.collected = true;
                        score += 10;
                        updateUI();
                    }
                }
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                e.x += e.speed * e.dir;
                if (e.x > e.maxX || e.x < e.minX) e.dir *= -1;

                if (isColliding(player, e)) {
                    if (player.vy > 0 && (player.y + player.height) < e.y + (e.h/2)) {
                        e.alive = false;
                        player.vy = jumpPower * 0.7;
                        score += 20;
                        updateUI();
                    } else {
                        loseLife();
                    }
                }
            }

            if (player.x + player.width > finishLine.x && player.x < finishLine.x + finishLine.width) {
                if (player.y + player.height > finishLine.y) {
                    gameActive = false;
                    gameWin = true;
                }
            }
        }

        function loseLife() {
            lives--;
            updateUI();
            if (lives <= 0) {
                gameActive = false;
                gameOver = true;
            } else {
                player.x = 50; player.y = 100; player.vx = 0; player.vy = 0;
                cameraX = 0;
            }
        }

        function draw() {
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255,255,255,0.8)";
            let cloudOffset = (cameraX * 0.3) % 400;
            ctx.beginPath();
            ctx.arc(100 - cloudOffset, 100, 40, 0, Math.PI*2);
            ctx.arc(150 - cloudOffset, 100, 50, 0, Math.PI*2);
            ctx.arc(200 - cloudOffset, 100, 40, 0, Math.PI*2);
            ctx.fill();

            ctx.save();
            ctx.translate(-cameraX, 0);

            for (let p of platforms) {
                ctx.fillStyle = "#4CAF50";
                ctx.fillRect(p.x, p.y, p.w, 15);
                ctx.fillStyle = "#795548";
                ctx.fillRect(p.x, p.y + 15, p.w, p.h - 15);
                ctx.strokeStyle = "#3E2723";
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            }

            for (let c of coins) {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fillStyle = "#FFEB3B";
                    ctx.fill();
                    ctx.strokeStyle = "#FBC02D";
                    ctx.stroke();
                }
            }

            for (let e of enemies) {
                if (e.alive) {
                    ctx.fillStyle = "#F44336";
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = "white";
                    ctx.fillRect(e.x + 5, e.y + 5, 5, 5);
                    ctx.fillRect(e.x + 15, e.y + 5, 5, 5);
                }
            }

            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(finishLine.x, finishLine.y, finishLine.width, finishLine.height);
            ctx.fillStyle = "yellow";
            ctx.fillRect(finishLine.x - 10, finishLine.y - 30, 40, 10);
            ctx.fillStyle = "black";
            ctx.font = "10px monospace";
            ctx.fillText("FINISH", finishLine.x - 5, finishLine.y - 22);

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "white";
            if (player.vx < 0) ctx.fillRect(player.x + 2, player.y + 8, 5, 5);
            else ctx.fillRect(player.x + player.width - 7, player.y + 8, 5, 5);

            ctx.restore();

            if (gameOver || gameWin) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.fillStyle = gameWin ? "#4CAF50" : "#F44336";
                ctx.font = "32px monospace";
                ctx.fillText(gameWin ? "YOU WIN!" : "GAME OVER", canvas.width/2, canvas.height/2 - 30);
                ctx.fillStyle = "white";
                ctx.font = "20px monospace";
                ctx.fillText("Koin: " + score, canvas.width/2, canvas.height/2 + 10);
                ctx.font = "16px monospace";
                ctx.fillText("Ketuk Layar untuk Main Lagi", canvas.width/2, canvas.height/2 + 60);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive || gameOver || gameWin) {
                requestAnimationFrame(gameLoop);
            }
        }

        canvas.addEventListener('touchstart', (e) => {
            if (gameOver || gameWin) initGame();
        });
        canvas.addEventListener('mousedown', (e) => {
            if (gameOver || gameWin) initGame();
        });
        document.addEventListener('keydown', (e) => {
            if ((e.code === 'Space') && (gameOver || gameWin)) initGame();
        });

        initGame();
    </script>
</body>
</html>
