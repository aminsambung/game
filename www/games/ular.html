<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Ular - Level Edition</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #202124;
            font-family: monospace;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        .ui-container {
            display: flex;
            justify-content: space-between;
            width: 80%; /* Lebar UI mengikuti canvas */
            max-width: 360px;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            background-color: #2d2d2d;
            border: 3px solid #535353;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            
            height: 80vh; 
            max-height: 640px; 
            width: auto; 
            aspect-ratio: 9 / 16; 
        }
    </style>
</head>
<body>
    <a href="../index.html" style="position: fixed; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; text-decoration: none; border-radius: 5px; font-family: monospace; font-weight: bold;">
    ⬅ MENU
</a>

    <!-- UI Skor dan Level -->
    <div class="ui-container">
        <div id="score">Skor: 0</div>
        <div id="level">Level: 1</div>
    </div>
    
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');

        const box = 20; 
        
        let snake, direction, food, score, gameInterval;
        let changingDirection = false;
        let isGameOver = false; 
        
        // Variabel untuk Level
        let level = 1;
        let speed = 150; // Kecepatan awal (makin kecil makin cepat)
        let targetScore = 5; // Skor yang dibutuhkan untuk naik level
        let showLevelUpText = false;

        function initGame() {
            if (gameInterval) clearInterval(gameInterval);
            
            snake = [
                {x: 9 * box, y: 16 * box},
                {x: 8 * box, y: 16 * box},
                {x: 7 * box, y: 16 * box}
            ];
            direction = "RIGHT";
            score = 0;
            level = 1;
            speed = 150;
            targetScore = 5;
            
            scoreElement.innerText = "Skor: 0";
            levelElement.innerText = "Level: 1";
            
            changingDirection = false;
            isGameOver = false;
            showLevelUpText = false;
            generateFood();
            
            // Mulai game loop
            gameInterval = setInterval(draw, speed); 
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
            for (let i = 0; i < snake.length; i++) {
                if (food.x === snake[i].x && food.y === snake[i].y) {
                    generateFood();
                }
            }
        }

        function drawGrid() {
            ctx.strokeStyle = "#383838";
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += box) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i <= canvas.height; i += box) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // Fungsi Naik Level
        function levelUp() {
            level++;
            targetScore += 5; // Level berikutnya butuh +5 skor lagi
            speed -= 15; // Ular jadi lebih cepat (kurangi jeda waktu)
            
            levelElement.innerText = "Level: " + level;
            
            // Tampilkan teks LEVEL UP sebentar
            showLevelUpText = true;
            setTimeout(() => { showLevelUpText = false; }, 1500);

            // Restart interval dengan kecepatan baru
            clearInterval(gameInterval);
            gameInterval = setInterval(draw, speed);
        }

        function draw() {
            ctx.fillStyle = "#2d2d2d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            // Gambar Ular
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#4CAF50" : "#388E3C";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#2d2d2d";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Gambar Makanan
            ctx.fillStyle = "#F44336";
            ctx.beginPath();
            ctx.arc(food.x + box/2, food.y + box/2, box/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Teks Level Up
            if (showLevelUpText) {
                ctx.fillStyle = "#FFEB3B"; // Warna Kuning
                ctx.font = "30px monospace";
                ctx.textAlign = "center";
                ctx.fillText("LEVEL UP!", canvas.width/2, canvas.height/2);
                ctx.textAlign = "left";
            }

            // Pergerakan
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (direction === "LEFT") snakeX -= box;
            if (direction === "UP") snakeY -= box;
            if (direction === "RIGHT") snakeX += box;
            if (direction === "DOWN") snakeY += box;

            if (snakeX === food.x && snakeY === food.y) {
                score++;
                scoreElement.innerText = "Skor: " + score;
                generateFood();
                
                // Cek apakah sudah mencapai target skor untuk naik level
                if (score >= targetScore) {
                    levelUp();
                }
            } else {
                snake.pop();
            }

            let newHead = {x: snakeX, y: snakeY};

            // Cek Tabrakan
            if (
                snakeX < 0 || snakeX >= canvas.width || 
                snakeY < 0 || snakeY >= canvas.height || 
                collision(newHead, snake)
            ) {
                gameOver();
                return;
            }

            snake.unshift(newHead);
            changingDirection = false;
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) {
                    return true;
                }
            }
            return false;
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameInterval = null; 
            isGameOver = true;   

            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.font = "32px monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 60);
            
            ctx.font = "20px monospace";
            ctx.fillText("Skor Akhir: " + score, canvas.width/2, canvas.height/2);
            ctx.fillText("Level Tercapai: " + level, canvas.width/2, canvas.height/2 + 30);
            
            ctx.font = "16px monospace";
            ctx.fillText("Ketuk Layar / Spasi", canvas.width/2, canvas.height/2 + 80);
            ctx.fillText("untuk Main Lagi", canvas.width/2, canvas.height/2 + 110);
        }

        // Kontrol Keyboard
        document.addEventListener("keydown", (e) => {
            if (isGameOver) {
                if (e.key === " ") initGame();
                return;
            }

            if (changingDirection) return;
            
            if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && direction !== "RIGHT") {
                direction = "LEFT"; changingDirection = true;
            }
            if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && direction !== "DOWN") {
                direction = "UP"; changingDirection = true;
            }
            if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && direction !== "LEFT") {
                direction = "RIGHT"; changingDirection = true;
            }
            if ((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && direction !== "UP") {
                direction = "DOWN"; changingDirection = true;
            }
        });

        // Kontrol Layar Sentuh
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            if (isGameOver) {
                initGame();
                return;
            }
            
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (changingDirection || isGameOver) return;

            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && direction !== "LEFT") { direction = "RIGHT"; changingDirection = true; }
                else if (dx < -30 && direction !== "RIGHT") { direction = "LEFT"; changingDirection = true; }
            } else {
                if (dy > 30 && direction !== "UP") { direction = "DOWN"; changingDirection = true; }
                else if (dy < -30 && direction !== "DOWN") { direction = "UP"; changingDirection = true; }
            }
        }, {passive: false});

        initGame();
    </script>
</body>
</html>
