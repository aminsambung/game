<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Memory Match</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #202124;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        .info {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        
        /* Papan Permainan */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            grid-template-rows: repeat(4, 70px);
            gap: 10px;
            perspective: 1000px; /* Efek 3D */
        }

        /* Kartu */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.4s;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* Animasi membalik kartu */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Sisi Depan (Belakang Kartu) */
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-size: 40px;
        }

        .card-front {
            background-color: #535353;
            color: white;
            /* Gambar tanda tanya di belakang kartu */
            font-size: 30px;
            font-weight: bold;
        }

        .card-back {
            background-color: #2d2d2d;
            border: 2px solid #4CAF50;
            transform: rotateY(180deg);
        }

        /* Tombol Restart */
        #resetBtn {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none; 
        }
        
        #resetBtn:active {
            background-color: #388E3C;
        }
    </style>
</head>
<body>

    <a href="../index.html" style="position: fixed; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; text-decoration: none; border-radius: 5px; font-family: monospace; font-weight: bold;">
    ⬅ MENU
</a>
    <h1>Memory Match</h1>
    
    <div class="info">
        <div id="moves">Langkah: 0</div>
        <div id="pairs">Sisa: 8</div>
    </div>

    <div class="game-board" id="board"></div>

    <button id="resetBtn">Main Lagi</button>

    <script>
        const boardElement = document.getElementById('board');
        const movesElement = document.getElementById('moves');
        const pairsElement = document.getElementById('pairs');
        const resetBtn = document.getElementById('resetBtn');

        // Daftar Emoji sebagai gambar kartu
        const emojis = ['🐶', '🐱', '🦊', '🐻', '🐼', '🐸', '🦁', '🐷'];
        
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        function initGame() {
            // Reset variabel
            cards = [...emojis, ...emojis]; // Gandakan emoji agar ada pasangannya
            cards.sort(() => 0.5 - Math.random()); // Acak array
            
            hasFlippedCard = false;
            lockBoard = false;
            moves = 0;
            matchedPairs = 0;
            
            movesElement.innerText = "Langkah: 0";
            pairsElement.innerText = "Sisa: 8";
            resetBtn.style.display = "none";
            boardElement.innerHTML = '';

            // Buat elemen kartu
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.framework = emoji;
                card.dataset.index = index;

                // Sisi depan (tanda tanya)
                const frontFace = document.createElement('div');
                frontFace.classList.add('card-front');
                frontFace.innerText = "?";

                // Sisi belakang (Emoji)
                const backFace = document.createElement('div');
                backFace.classList.add('card-back');
                backFace.innerText = emoji;

                card.appendChild(frontFace);
                card.appendChild(backFace);

                card.addEventListener('click', flipCard);
                boardElement.appendChild(card);
            });
        }

        function flipCard() {
            // Jangan izinkan klik jika papan dikunci, kartu sudah terbuka, atau kartu yang sama diklik
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // Klik pertama
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Klik kedua
            secondCard = this;
            moves++;
            movesElement.innerText = "Langkah: " + moves;
            
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            // Matikan event klik pada kartu yang cocok
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            matchedPairs++;
            pairsElement.innerText = "Sisa: " + (8 - matchedPairs);

            // Cek apakah game selesai
            if (matchedPairs === 8) {
                setTimeout(() => {
                    alert(`Selamat! Kamu menang dalam ${moves} langkah!`);
                    resetBtn.style.display = "block";
                }, 500);
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true; // Kunci papan agar tidak bisa klik kartu lain

            // Tunggu 1 detik, lalu tutup kembali kartunya
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        resetBtn.addEventListener('click', initGame);

        // Mulai game
        initGame();
    </script>
</body>
</html>
