1name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Install Node Dependencies
      run: npm install

    - name: 4. Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 5. Setup Android SDK (Fix 'tools' error)
      uses: android-actions/setup-android@v4
      with:
        # Mengabaikan paket 'tools' yang sudah dihapus Google
        packages: 'platform-tools' 

    - name: 6. Add Android Platform
      run: npx cap add android

    - name: 7. Sync Web Files to Android
      run: npx cap sync android

    - name: 8. Grant Execute Permission for Gradlew
      run: chmod +x android/gradlew

    - name: 9. Build APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: 10. Rename APK
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KumpulanGame-Aminsambung.apk

    - name: 11. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KumpulanGame-APK
        path: android/app/build/outputs/apk/debug/KumpulanGame-Aminsambung.apk
